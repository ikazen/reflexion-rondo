services:
  rondo-daemon:
    image: registry.internal:5000/reflexion-rondo/daemon:v1.4.5
    networks:
      - nexus
    env_file:
      - /var/lib/rondo/.env
    environment:
      DAEMON_API_HOST: "0.0.0.0"
      PYTHONUNBUFFERED: "1"
      AIRFLOW_URL: "http://airflow-api-server-1:8080"
    volumes:
      - /var/lib/rondo/kaggle_credentials.json:/root/.kaggle/credentials.json:ro
    restart: always

  rondo-dashboard:
    image: registry.internal:5000/reflexion-rondo/daemon:v1.4.5
    networks:
      - nexus
    env_file:
      - /var/lib/rondo/.env
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["uv", "run", "--no-sync", "streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    restart: always

networks:
  nexus:
    external: true
