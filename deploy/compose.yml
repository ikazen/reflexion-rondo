services:
  rondo-daemon:
    image: registry.internal:80/reflexion-rondo/daemon:latest
    network_mode: host
    volumes:
      - /var/lib/rondo:/app/runs             # DuckDB + 제출 파일
      - /var/lib/rondo/data:/app/data        # 대회 데이터셋
      - /tmp/rondo-eval:/tmp/rondo-eval      # eval DinD tmpdir (호스트와 공유)
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - /var/lib/rondo/.env
    environment:
      RONDO_DB_URL: ${RONDO_DB_URL}
      EVAL_DOCKER_IMAGE: registry.internal:80/reflexion-rondo/eval:latest
      TMPDIR: /tmp/rondo-eval
      DAEMON_API_HOST: "0.0.0.0"
      PYTHONUNBUFFERED: "1"
    restart: always
