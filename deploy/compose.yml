services:
  rondo-daemon:
    image: registry.internal:80/reflexion-rondo/daemon:latest
    networks:
      - nexus
    env_file:
      - /var/lib/rondo/.env
    environment:
      DAEMON_API_HOST: "0.0.0.0"
      PYTHONUNBUFFERED: "1"
      AIRFLOW_URL: "http://ops-vm-api-server-1:8080"
    restart: always

  rondo-dashboard:
    image: registry.internal:80/reflexion-rondo/daemon:latest
    networks:
      - nexus
    env_file:
      - /var/lib/rondo/.env
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["uv", "run", "streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    restart: always

networks:
  nexus:
    external: true
