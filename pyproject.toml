[project]
name = "reflexion-rondo"
version = "0.1.0"
description = "Self-improving Reflexion system for Kaggle tabular competitions"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "duckdb>=1.5.3",
    "kaggle>=2.2.0",
    "lightgbm>=4.6.0",
    "ollama>=0.6.2",
    "pandas>=3.0.3",
    "polars>=1.41.2",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "streamlit>=1.58.0",
    "xgboost>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
